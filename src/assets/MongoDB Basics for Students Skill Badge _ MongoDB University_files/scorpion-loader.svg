<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 22 44 44" height="44px" width="44px">
  <style>
      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes circular-progress {
        0% {
          stroke-dasharray: 1px, 200px;
          stroke-dashoffset: 0px;
        }

        50% {
          stroke-dasharray: 100px, 200px;
          stroke-dashoffset: -15px;
        }

        100% {
          stroke-dasharray: 100px, 200px;
          stroke-dashoffset: -125px;
        }
      }

      svg {
        animation: rotate 1.4s linear infinite
      }
      
      circle {
        animation: circular-progress 1.4s ease-in-out infinite;
        stroke-dasharray: 80px, 200px;
        stroke-dashoffset: 0px;
      }
    </style>
  <circle cx="44" cy="44" r="20.2" fill="none" stroke-width="3.6" stroke="#333"></circle>
</svg>